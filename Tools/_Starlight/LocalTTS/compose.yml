services:
  redis:
    image: redis:7.4-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  tts-worker:
    build:
      context: worker
    environment:
      REDIS_URL: redis://redis:6379/0
      PIPER_DATA_DIR: /data
      PIPER_VOICE: en_US-lessac-low
      TTS_CACHE_TTL_SECONDS: "3600"
    volumes:
      - tts-models:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tts-models:
