name: Build & Test Debug

# Cancel older jobs on PRs when new changes are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [ master, staging, stable, Starlight, starlight-dev, upstream-devtest, fix/tests ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ master, staging, stable, Starlight, starlight-dev, upstream-devtest ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    if: github.actor != 'PJBot' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout Master
      uses: actions/checkout@v4.2.2

    - name: Setup Submodule
      run: |
        git submodule update --init --recursive

    - name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update Engine Submodules
      run: |
        cd RobustToolbox/
        git submodule update --init --recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --configuration DebugOpt --no-restore /m 2>&1 | tee build.log

    - name: Setup reviewdog
      if: github.event_name == 'pull_request'
      uses: reviewdog/action-setup@v1

    - name: Report warnings on changed lines
      if: github.event_name == 'pull_request'
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        reviewdog -efm='%f(%l\,%c): warning %m' \
          -name="dotnet-build" \
          -reporter=github-pr-review \
          -filter-mode=added \
          -fail-level=any \
          -tee \
          < build.log

    - name: Run Content.Tests
      shell: pwsh
      run: dotnet test --no-build --configuration DebugOpt Content.Tests/Content.Tests.csproj --logger "console;verbosity=normal" -- NUnit.ConsoleOut=0 NUnit.TestOutputXml="logs" NUnit.WorkDirectory="$(pwd)/test_results"

    - name: Run Content.IntegrationTests
      id: run-integration-tests
      shell: bash
      env:
        DOTNET_gcServer: "1"
      run: |
        dotnet test --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj \
          --logger "console;verbosity=normal" \
          --results-directory test_results \
          --blame-hang --blame-hang-timeout 3min \
          -- NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed NUnit.TestOutputXml="logs" NUnit.WorkDirectory="$(pwd)/test_results"

        # Guard: dotnet test exits 0 even when zero tests run, which would let a
        # silently-broken run pass. Assert NUnit actually executed a test suite.
        xml="test_results/logs/Content.IntegrationTests.xml"
        if [ ! -f "$xml" ]; then
          echo "::error::No integration test result XML was produced — no tests ran."
          exit 1
        fi
        total=$(grep -o 'total="[0-9]*"' "$xml" | head -1 | grep -o '[0-9]*')
        if [ -z "$total" ] || [ "$total" -eq 0 ]; then
          echo "::error::Integration test run reported 0 tests — nothing executed."
          exit 1
        fi
        echo "Integration tests executed: $total"

    - name: Upload crash dumps
      id: upload-dumps
      uses: actions/upload-artifact@v4
      if: ${{ always() && steps.run-integration-tests.outcome == 'failure' }}
      with:
        name: blame-dump
        path: |
          test_results/**/*.dmp
          test_results/**/*Sequence*.xml
        retention-days: 3
        if-no-files-found: ignore

    - name: Report hung tests
      continue-on-error: true
      if: always()
      run: |
        shopt -s nullglob globstar
        found=false
        for seq in test_results/**/*Sequence*.xml; do
          if [ "$found" = false ]; then
            echo "## :warning: Hung tests detected" >> "$GITHUB_STEP_SUMMARY"
            echo '```xml' >> "$GITHUB_STEP_SUMMARY"
            found=true
          fi
          cat "$seq" >> "$GITHUB_STEP_SUMMARY"
        done
        if [ "$found" = true ]; then
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.upload-dumps.outputs.artifact-url }}" ]; then
            echo ":floppy_disk: [Download crash dump](${{ steps.upload-dumps.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          fi
        fi

    - name: Archive NUnit3 test results.
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nunit3-results
        path: test_results/*
        retention-days: 7
        compression-level: 9
        if-no-files-found: ignore

  ci-success:
    name: Debug CI Required
    if: always()
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the build job was not successful
        if: ${{ needs.build.result != 'success' }}
        run: |
          echo "build=${{ needs.build.result }}"
          exit 1

      - name: CI succeeded
        run: exit 0
