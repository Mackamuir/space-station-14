name: Build & Test Debug

# Cancel older jobs on PRs when new changes are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [ master, staging, stable, Starlight, starlight-dev, upstream-devtest, fix/tests ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ master, staging, stable, Starlight, starlight-dev, upstream-devtest ]

env:
  CI_STORAGE: ${{ vars.CI_STORAGE || '/opt/actions-ci' }}
  NUGET_PACKAGES: ${{ vars.CI_STORAGE || '/opt/actions-ci' }}/nuget
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  build:
    if: github.actor != 'PJBot' && github.event.pull_request.draft == false
    runs-on: [ self-hosted, linux, x64 ]
    steps:
    - name: Checkout Master
      uses: actions/checkout@v4.2.2

    - name: Setup Submodule
      run: |
        git submodule update --init --recursive

    - name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update Engine Submodules
      run: |
        cd RobustToolbox/
        git submodule update --init --recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --configuration DebugOpt --no-restore /m

    - name: Discover Integration Tests
      run: |
        dotnet test --list-tests --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj 2>&1 | \
          python3 Tools/_Starlight/partition_tests.py generate 8 .integration-filters

    - name: Publish build to shared storage
      run: |
        set -euo pipefail
        RUN_DIR="$CI_STORAGE/runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        TREE="$RUN_DIR/tree"
        rm -rf "$TREE"; mkdir -p "$TREE"
        # Canonical build tree on the shared CoW volume. Test jobs reflink-clone
        # this, so there's no archive to compress or extract. rsync just excludes
        # .git (not needed by tests and large).
        rsync -a --exclude='.git' ./ "$TREE/"
        echo "Build published to $TREE"

  content-tests:
    needs: build
    name: Content Tests
    runs-on: [ self-hosted, linux, x64 ]
    timeout-minutes: 15
    steps:
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Clone build from shared storage
      run: |
        set -euo pipefail
        RUN_DIR="$CI_STORAGE/runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        # Isolated working copy for this job so concurrent jobs never share a tree.
        # --reflink=auto: instant copy-on-write clone on Btrfs/XFS.
        WORK="$RUN_DIR/content-tests"
        rm -rf "$WORK"
        cp -a --reflink=auto "$RUN_DIR/tree" "$WORK"
        # Per-job results dir. Never use /tmp: runners on the same host share it.
        RESULTS="$RUNNER_TEMP/test-results"
        rm -rf "$RESULTS"; mkdir -p "$RESULTS"
        echo "WORK=$WORK" >> "$GITHUB_ENV"
        echo "RESULTS=$RESULTS" >> "$GITHUB_ENV"

    - name: Run Content.Tests
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 15
        max_attempts: 2
        command: |
          cd "$WORK"
          dotnet test --no-build --configuration DebugOpt Content.Tests/Content.Tests.csproj --logger "trx;LogFileName=results.trx" --results-directory "$RESULTS"

    - name: Test results
      continue-on-error: true
      if: always()
      run: |
        dotnet tool install -g dotnet-trx 2>/dev/null || true
        mkdir -p "$RESULTS"
        trx --path "$RESULTS" -o -v verbose || true

  integration-tests:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    name: "Integration Tests (shard ${{ matrix.shard }})"
    runs-on: [ self-hosted, linux, x64 ]
    steps:
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Clone build from shared storage
      run: |
        set -euo pipefail
        RUN_DIR="$CI_STORAGE/runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        # --reflink=auto: instant copy-on-write clone on Btrfs/XFS.
        WORK="$RUN_DIR/shard-${{ matrix.shard }}"
        rm -rf "$WORK"
        cp -a --reflink=auto "$RUN_DIR/tree" "$WORK"
        RESULTS="$RUNNER_TEMP/test-results"
        rm -rf "$RESULTS"; mkdir -p "$RESULTS"
        echo "WORK=$WORK" >> "$GITHUB_ENV"
        echo "RESULTS=$RESULTS" >> "$GITHUB_ENV"

    - name: Run Content.IntegrationTests
      id: run-integration-tests
      uses: nick-fields/retry@v3
      env:
        DOTNET_gcServer: "1"
      with:
        timeout_minutes: 17
        max_attempts: 2
        retry_on: any
        command: |
          cd "$WORK"
          RUNSETTINGS=".integration-filters/shard_${{ matrix.shard }}.runsettings"
          if [ ! -f "$RUNSETTINGS" ]; then
            echo "No tests assigned to shard ${{ matrix.shard }}"
            exit 0
          fi
          timeout --signal=TERM --kill-after=2m 15m \
            dotnet test --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal" --results-directory "$RESULTS" --blame-hang --blame-hang-timeout 3min --settings "$RUNSETTINGS"

    - name: Test results
      continue-on-error: true
      if: always()
      run: |
        dotnet tool install -g dotnet-trx 2>/dev/null || true
        mkdir -p "$RESULTS"
        trx --path "$RESULTS" -o -v verbose || true

    - name: Upload crash dumps
      id: upload-dumps
      uses: actions/upload-artifact@v4
      if: ${{ always() && steps.run-integration-tests.outcome == 'failure' }}
      with:
        name: blame-dump-shard-${{ matrix.shard }}
        path: |
          ${{ env.RESULTS }}/**/*.dmp
          ${{ env.RESULTS }}/**/*Sequence*.xml
        retention-days: 3
        if-no-files-found: ignore

    - name: Report hung tests
      continue-on-error: true
      if: always()
      run: |
        shopt -s nullglob globstar
        found=false
        for seq in "$RESULTS"/**/*Sequence*.xml; do
          if [ "$found" = false ]; then
            echo "## :warning: Hung tests detected (shard ${{ matrix.shard }})" >> "$GITHUB_STEP_SUMMARY"
            echo '```xml' >> "$GITHUB_STEP_SUMMARY"
            found=true
          fi
          cat "$seq" >> "$GITHUB_STEP_SUMMARY"
        done
        if [ "$found" = true ]; then
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.upload-dumps.outputs.artifact-url }}" ]; then
            echo ":floppy_disk: [Download crash dump](${{ steps.upload-dumps.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          fi
        fi

  ci-success:
    name: Debug CI Required
    if: ${{ always() }}
    needs:
      - build
      - content-tests
      - integration-tests
    runs-on: [ self-hosted, linux, x64 ]
    steps:
      - name: Fail if any dependency was not successful
        if: ${{ needs.build.result != 'success' || needs['content-tests'].result != 'success' || needs['integration-tests'].result != 'success' }}
        run: |
          echo "build=${{ needs.build.result }}"
          echo "content-tests=${{ needs['content-tests'].result }}"
          echo "integration-tests=${{ needs['integration-tests'].result }}"
          exit 1

      - name: CI succeeded
        run: exit 0

  cleanup:
    name: Cleanup Shared Storage
    needs:
      - content-tests
      - integration-tests
    if: always()
    runs-on: [ self-hosted, linux, x64 ]
    steps:
      - name: Remove this run's shared build data
        run: |
          set -euo pipefail
          RUN_DIR="$CI_STORAGE/runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$RUN_DIR" || true
          # Safety sweep: reclaim space from runs that were cancelled before
          # their cleanup job could run (older than 1 day).
          if [ -d "$CI_STORAGE/runs" ]; then
            find "$CI_STORAGE/runs" -maxdepth 1 -mindepth 1 -type d -mtime +1 -exec rm -rf {} + || true
          fi
