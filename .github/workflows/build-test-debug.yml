name: Build & Test Debug

# Cancel older jobs on PRs when new changes are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [ master, staging, stable, Starlight, starlight-dev, upstream-devtest, fix/tests ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ master, staging, stable, Starlight, starlight-dev, upstream-devtest ]
  workflow_dispatch:

jobs:
  build:
    if: github.actor != 'PJBot' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Master
      uses: actions/checkout@v7

    - name: Setup Submodule
      run: |
        git submodule update --init --recursive

    - name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update Engine Submodules
      run: |
        cd RobustToolbox/
        git submodule update --init --recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --configuration DebugOpt --no-restore /m

    - name: Discover Integration Tests
      run: |
        dotnet test --list-tests --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj 2>&1 | \
          python3 Tools/_Starlight/partition_tests.py generate 6 .integration-filters

    - name: Archive build output
      run: tar --use-compress-program='zstd -T0' -cf /tmp/build.tar.zst --exclude='.git' .

    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: build-output
        path: /tmp/build.tar.zst
        retention-days: 1
        compression-level: 0

  content-tests:
    needs: build
    name: Content Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download build artifact
      uses: actions/download-artifact@v8
      with:
        name: build-output

    - name: Extract build
      run: tar --use-compress-program='zstd -d -T0' -xf build.tar.zst && rm build.tar.zst

    - name: Restore packages
      run: dotnet restore Content.Tests/Content.Tests.csproj

    - name: Run Content.Tests
      uses: nick-fields/retry@v4
      with:
        timeout_minutes: 15
        max_attempts: 2
        command: dotnet test --no-build --configuration DebugOpt Content.Tests/Content.Tests.csproj --logger "trx;LogFileName=results.trx" --results-directory /tmp/test-results

    - name: Test results
      continue-on-error: true
      if: always()
      run: |
        dotnet tool install -g dotnet-trx 2>/dev/null || true
        mkdir -p /tmp/test-results
        trx --path /tmp/test-results -o -v verbose || true

  integration-tests:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    name: "Integration Tests (shard ${{ matrix.shard }})"
    runs-on: ubuntu-latest
    steps:
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download build artifact
      uses: actions/download-artifact@v8
      with:
        name: build-output

    - name: Extract build
      run: tar --use-compress-program='zstd -d -T0' -xf build.tar.zst && rm build.tar.zst

    - name: Restore packages
      run: dotnet restore Content.IntegrationTests/Content.IntegrationTests.csproj

    - name: Run Content.IntegrationTests
      id: run-integration-tests
      uses: nick-fields/retry@v4
      env:
        DOTNET_gcServer: "1"
      with:
        timeout_minutes: 17
        max_attempts: 2
        retry_on: any
        command: |
          set -o pipefail
          mkdir -p /tmp/test-logs
          RUNSETTINGS=".integration-filters/shard_${{ matrix.shard }}.runsettings"
          if [ ! -f "$RUNSETTINGS" ]; then
            echo "No tests assigned to shard ${{ matrix.shard }}"
            exit 0
          fi
          timeout --signal=TERM --kill-after=2m 15m \
            dotnet test --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj --logger "trx;LogFileName=results.trx" --logger "console;verbosity=detailed" --results-directory /tmp/test-results --blame-hang --blame-hang-timeout 3min --settings "$RUNSETTINGS" 2>&1 | tee "/tmp/test-logs/integration-tests-shard-${{ matrix.shard }}.log"

    - name: Report integration test errors
      if: always()
      run: |
        grep -nE -C 8 'SERVER:.*\[ERRO\]|CLIENT:.*\[ERRO\]|ExecuteError|UnhandledException|Exception:|Failed to execute toolshed command|crash|fatal' "/tmp/test-logs/integration-tests-shard-${{ matrix.shard }}.log" \
          >> "$GITHUB_STEP_SUMMARY" || true

    - name: Test results
      continue-on-error: true
      if: always()
      run: |
        dotnet tool install -g dotnet-trx
        mkdir -p /tmp/test-results
        trx --path /tmp/test-results -o

    - name: Upload test results
      uses: actions/upload-artifact@v6
      if: ${{ always() && (github.event_name == 'workflow_dispatch' || steps.run-integration-tests.outcome == 'failure') }}
      with:
        name: test-trx-shard-${{ matrix.shard }}
        path: /tmp/test-results/**/*.trx
        retention-days: 7
        if-no-files-found: ignore

    - name: Upload integration test log
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: integration-test-log-shard-${{ matrix.shard }}
        path: /tmp/test-logs/integration-tests-shard-${{ matrix.shard }}.log
        retention-days: 7
        if-no-files-found: ignore

    - name: Upload crash dumps
      id: upload-dumps
      uses: actions/upload-artifact@v6
      if: ${{ always() && steps.run-integration-tests.outcome == 'failure' }}
      with:
        name: blame-dump-shard-${{ matrix.shard }}
        path: |
          /tmp/test-results/**/*.dmp
          /tmp/test-results/**/*Sequence*.xml
        retention-days: 3
        if-no-files-found: ignore

    - name: Report hung tests
      continue-on-error: true
      if: always()
      run: |
        shopt -s nullglob globstar
        found=false
        for seq in /tmp/test-results/**/*Sequence*.xml; do
          if [ "$found" = false ]; then
            echo "## :warning: Hung tests detected (shard ${{ matrix.shard }})" >> "$GITHUB_STEP_SUMMARY"
            echo '```xml' >> "$GITHUB_STEP_SUMMARY"
            found=true
          fi
          cat "$seq" >> "$GITHUB_STEP_SUMMARY"
        done
        if [ "$found" = true ]; then
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.upload-dumps.outputs.artifact-url }}" ]; then
            echo ":floppy_disk: [Download crash dump](${{ steps.upload-dumps.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          fi
        fi

  ci-success:
    name: Debug CI Required
    if: ${{ always() }}
    needs:
      - build
      - content-tests
      - integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency was not successful
        if: ${{ needs.build.result != 'success' || needs['content-tests'].result != 'success' || needs['integration-tests'].result != 'success' }}
        run: |
          echo "build=${{ needs.build.result }}"
          echo "content-tests=${{ needs['content-tests'].result }}"
          echo "integration-tests=${{ needs['integration-tests'].result }}"
          exit 1

      - name: CI succeeded
        run: exit 0

  harvest-timings:
    name: Harvest test timings
    needs: integration-tests
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download shard test results
        uses: actions/download-artifact@v8
        with:
          pattern: test-trx-shard-*
          path: /tmp/trx

      - name: Harvest timings
        id: harvest
        run: |
          python3 Tools/_Starlight/partition_tests.py harvest /tmp/trx Tools/_Starlight/test-timings.json
          # Diff the freshly harvested file against the committed one. An empty
          # diff means every measurement stayed inside the noise dead-band, so
          # committing would be a no-op (and a PR job would open nothing).
          git diff -- Tools/_Starlight/test-timings.json > /tmp/timings.diff || true
          if [ -s /tmp/timings.diff ]; then
            changed_lines=$(grep -E '^[+-]' /tmp/timings.diff | grep -vE '^(\+\+\+|---)' | wc -l)
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_lines=$changed_lines" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "changed_lines=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload test-timings.json
        uses: actions/upload-artifact@v6
        with:
          name: test-timings
          path: Tools/_Starlight/test-timings.json
          retention-days: 14

      - name: Summary
        run: |
          {
            echo "## Test timings harvested"
            echo
            if [ "${{ needs.integration-tests.result }}" != "success" ]; then
              echo ":warning: **Some shards did not pass** (\`integration-tests\` = \`${{ needs.integration-tests.result }}\`)."
              echo "Timings from a shard that crashed or timed out are missing or truncated."
              echo "Prefer harvesting from a fully green run before committing."
              echo
            fi
            if [ "${{ steps.harvest.outputs.changed }}" = "true" ]; then
              echo ":large_orange_diamond: **Would overwrite \`test-timings.json\`** — ${{ steps.harvest.outputs.changed_lines }} line(s) moved past the noise dead-band. Committing this run changes the file."
              echo
              echo "<details><summary>Show diff vs committed timings</summary>"
              echo
              echo '```diff'
              cat /tmp/timings.diff
              echo '```'
              echo
              echo "</details>"
            else
              echo ":white_check_mark: **No change** — every timing stayed within the dead-band of the committed \`test-timings.json\`. Committing would be a no-op, so no PR is needed."
            fi
            echo
            echo "Download the \`test-timings\` artifact and commit it as \`Tools/_Starlight/test-timings.json\`."
            echo "Once committed, \`partition_tests.py generate\` picks it up automatically;"
            echo "\`WEIGHT_OVERRIDES\` stays as the fallback for when the file is absent."
            echo
            echo "### Slowest 15 methods"
            echo '```'
            python3 -c "import json;d=json.load(open('Tools/_Starlight/test-timings.json'));[print(f'{v:9.1f}s  {k}') for k,v in sorted(d.items(),key=lambda x:-x[1])[:15]]"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Cleanup Artifacts
    needs:
      - content-tests
      - integration-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Delete build artifact
        uses: geekyeggo/delete-artifact@v6
        with:
          name: build-output
