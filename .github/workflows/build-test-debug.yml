name: Build & Test Debug

# Cancel older jobs on PRs when new changes are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [ master, staging, stable, Starlight, starlight-dev, upstream-devtest, fix/tests, main ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ master, staging, stable, Starlight, starlight-dev, upstream-devtest, main ]
  workflow_dispatch:

# `checks: write` is honoured for same-repo PRs, pushes, merge groups and manual
# runs — that is what the inline reporter steps below rely on. A PR from a fork
# is downgraded to a read-only token regardless of what is requested here, so
# those are reported by test-report.yml instead.
permissions:
  contents: read
  actions: write
  checks: write

jobs:
  build:
    if: github.actor != 'PJBot' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Master
      uses: actions/checkout@v7

    - name: Setup Submodule
      run: |
        git submodule update --init --recursive

    - name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update Engine Submodules
      run: |
        cd RobustToolbox/
        git submodule update --init --recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --configuration DebugOpt --no-restore /m

    - name: Discover Integration Tests
      run: |
        dotnet test --list-tests --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj 2>&1 | \
          python3 Tools/_Starlight/partition_tests.py generate 6 .integration-filters

    - name: Archive build output
      run: tar --use-compress-program='zstd -T0' -cf /tmp/build.tar.zst --exclude='.git' .

    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: build-output
        path: /tmp/build.tar.zst
        retention-days: 1
        compression-level: 0

  content-tests:
    needs: build
    name: Content Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    # The reporter step below resolves annotation paths with `git ls-files`, and
    # the build tarball excludes .git. Checkout must come first: it cleans the
    # workspace, and the tarball (carrying no .git) is then laid over the top.
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download build artifact
      uses: actions/download-artifact@v8
      with:
        name: build-output

    - name: Extract build
      run: tar --use-compress-program='zstd -d -T0' -xf build.tar.zst && rm build.tar.zst

    - name: Restore packages
      run: dotnet restore Content.Tests/Content.Tests.csproj

    # NUnit.TestOutputXml makes the already-referenced NUnit3TestAdapter emit its
    # native NUnit 3 result XML — no extra logger package needed. It goes to its
    # own directory so the upload glob does not depend on the adapter's default
    # filename. trx is retained only because partition_tests.py harvests shard
    # timings out of it.
    - name: Run Content.Tests
      run: |
        timeout --signal=TERM --kill-after=2m 15m \
          dotnet test --no-build --configuration DebugOpt Content.Tests/Content.Tests.csproj --logger "trx;LogFileName=results.trx" --results-directory /tmp/test-results -- RunConfiguration.CollectSourceInformation=true NUnit.TestOutputXml=/tmp/nunit-results

    # Skipped on fork PRs, where the read-only token cannot create check runs;
    # test-report.yml covers those from the uploaded artifact below.
    - name: Report Content.Tests results
      # Not `head.repo.fork` — this repository is itself a fork, so that flag is
      # always true. What matters is whether the PR's head is in *this* repo.
      if: ${{ (success() || failure()) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      uses: dorny/test-reporter@v3
      with:
        name: Content Tests
        path: /tmp/nunit-results/*.xml
        reporter: dotnet-nunit
        list-suites: failed
        list-tests: failed
        # The test step has already failed the job; failing here too would just
        # mark the same problem red twice.
        fail-on-error: false

    - name: Upload Content.Tests results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: test-trx-content
        # Two roots, so inside the artifact these land as nunit-results/*.xml
        # and test-results/**/*.trx.
        path: |
          /tmp/nunit-results/*.xml
          /tmp/test-results/**/*.trx
        retention-days: 7
        if-no-files-found: ignore

  integration-tests:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    name: "Integration Tests (shard ${{ matrix.shard }})"
    runs-on: ubuntu-latest
    steps:
    # See the note in content-tests: the reporter needs a .git, the tarball has none.
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download build artifact
      uses: actions/download-artifact@v8
      with:
        name: build-output

    - name: Extract build
      run: tar --use-compress-program='zstd -d -T0' -xf build.tar.zst && rm build.tar.zst

    - name: Restore packages
      run: |
        dotnet restore Content.IntegrationTests/Content.IntegrationTests.csproj

    - name: Run Content.IntegrationTests
      id: run-integration-tests
      env:
        DOTNET_gcServer: "1"
      run: |
        set -o pipefail
        mkdir -p /tmp/test-logs
        RUNSETTINGS=".integration-filters/shard_${{ matrix.shard }}.runsettings"
        if [ ! -f "$RUNSETTINGS" ]; then
          echo "No tests assigned to shard ${{ matrix.shard }}"
          exit 0
        fi

        timeout --signal=TERM --kill-after=2m 15m \
          dotnet test --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj --logger "trx;LogFileName=results.trx" --logger "console;verbosity=detailed" --results-directory /tmp/test-results --blame-hang --blame-hang-timeout 3min --settings "$RUNSETTINGS" -- RunConfiguration.CollectSourceInformation=true NUnit.TestOutputXml=/tmp/nunit-results 2>&1 | tee "/tmp/test-logs/integration-tests-shard-${{ matrix.shard }}.log"

    - name: Report integration test errors
      if: always()
      run: |
        grep -nE -C 8 'SERVER:.*\[ERRO\]|CLIENT:.*\[ERRO\]|ExecuteError|UnhandledException|Exception:|Failed to execute toolshed command|crash|fatal' "/tmp/test-logs/integration-tests-shard-${{ matrix.shard }}.log" \
          >> "$GITHUB_STEP_SUMMARY" || true

    # Skipped on fork PRs; test-report.yml covers those from the artifact below.
    - name: Report Content.IntegrationTests results
      # Not `head.repo.fork` — this repository is itself a fork, so that flag is
      # always true. What matters is whether the PR's head is in *this* repo.
      if: ${{ (success() || failure()) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      uses: dorny/test-reporter@v3
      with:
        name: Integration Tests (shard ${{ matrix.shard }})
        path: /tmp/nunit-results/*.xml
        reporter: dotnet-nunit
        list-suites: failed
        list-tests: failed
        fail-on-error: false

    # Two consumers: test-report.yml reads the NUnit XML (matching these artifacts
    # by the regex /test-trx-shard-(.*)/, one check run per shard), and the
    # harvest-timings job reads the .trx.
    - name: Upload test results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: test-trx-shard-${{ matrix.shard }}
        # Keeping the NUnit XML in its own root also keeps the --blame-hang
        # Sequence_*.xml files (under test-results/) out of the reporter's glob.
        path: |
          /tmp/nunit-results/*.xml
          /tmp/test-results/**/*.trx
        retention-days: 7
        if-no-files-found: ignore

    - name: Upload integration test log
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: integration-test-log-shard-${{ matrix.shard }}
        path: /tmp/test-logs/integration-tests-shard-${{ matrix.shard }}.log
        retention-days: 7
        if-no-files-found: ignore

    - name: Upload crash dumps
      id: upload-dumps
      uses: actions/upload-artifact@v6
      if: ${{ always() && steps.run-integration-tests.outcome == 'failure' }}
      with:
        name: blame-dump-shard-${{ matrix.shard }}
        path: |
          /tmp/test-results/**/*.dmp
          /tmp/test-results/**/*Sequence*.xml
        retention-days: 3
        if-no-files-found: ignore

    - name: Report hung tests
      continue-on-error: true
      if: always()
      run: |
        shopt -s nullglob globstar
        found=false
        for seq in /tmp/test-results/**/*Sequence*.xml; do
          if [ "$found" = false ]; then
            echo "## :warning: Hung tests detected (shard ${{ matrix.shard }})" >> "$GITHUB_STEP_SUMMARY"
            echo '```xml' >> "$GITHUB_STEP_SUMMARY"
            found=true
          fi
          cat "$seq" >> "$GITHUB_STEP_SUMMARY"
        done
        if [ "$found" = true ]; then
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.upload-dumps.outputs.artifact-url }}" ]; then
            echo ":floppy_disk: [Download crash dump](${{ steps.upload-dumps.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          fi
        fi

  ci-success:
    name: Debug CI Required
    if: ${{ always() }}
    needs:
      - build
      - content-tests
      - integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency was not successful
        if: ${{ needs.build.result != 'success' || needs['content-tests'].result != 'success' || needs['integration-tests'].result != 'success' }}
        run: |
          echo "build=${{ needs.build.result }}"
          echo "content-tests=${{ needs['content-tests'].result }}"
          echo "integration-tests=${{ needs['integration-tests'].result }}"
          exit 1

      - name: CI succeeded
        run: exit 0

  cleanup:
    name: Cleanup Artifacts
    needs:
      - content-tests
      - integration-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Deleting an artifact needs `actions: write`, which a fork PR's read-only
      # token never gets. Tolerate the 403 there; `retention-days: 1` on the
      # upload reclaims the storage anyway.
      - name: Delete build artifact
        continue-on-error: true
        uses: geekyeggo/delete-artifact@v6
        with:
          name: build-output
