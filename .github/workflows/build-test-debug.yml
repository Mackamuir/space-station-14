name: Build & Test Debug

# Cancel older jobs on PRs when new changes are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [ master, staging, stable, Starlight, starlight-dev, upstream-devtest, fix/tests, main ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ master, staging, stable, Starlight, starlight-dev, upstream-devtest, main ]
  workflow_dispatch:

# `checks: write` is honoured for same-repo PRs, pushes, merge groups and manual
# runs — that is what the inline reporter steps below rely on. A PR from a fork
# is downgraded to a read-only token regardless of what is requested here, so
# those are reported by test-report.yml instead.
permissions:
  contents: read
  actions: write
  checks: write

jobs:
  build:
    if: github.actor != 'PJBot' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Master
      uses: actions/checkout@v7

    - name: Setup Submodule
      run: |
        git submodule update --init --recursive

    - name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update Engine Submodules
      run: |
        cd RobustToolbox/
        git submodule update --init --recursive

    # setup-dotnet reads the repository's global.json automatically, keeping the
    # SDK selection in one place. The build performs its own implicit restore.
    - name: Setup .NET
      uses: actions/setup-dotnet@v6

    - name: Build Project
      run: dotnet build --configuration DebugOpt /m

    - name: Discover Integration Tests
      run: |
        dotnet test --project Content.IntegrationTests/Content.IntegrationTests.csproj --list-tests --no-build --configuration DebugOpt 2>&1 | \
          python3 Tools/_Starlight/partition_tests.py generate 6 .integration-filters

    - name: Archive build output
      run: tar --use-compress-program='zstd -T0' -cf /tmp/build.tar.zst --exclude='.git' .

    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: build-output
        path: /tmp/build.tar.zst
        retention-days: 1
        compression-level: 0

  content-tests:
    needs: build
    name: Content Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    # The build tarball excludes .git. Checkout must come first because it cleans
    # the workspace, and the tarball is then laid over the checked-out tree.
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6

    - name: Download build artifact
      uses: actions/download-artifact@v8
      with:
        name: build-output

    - name: Extract build
      run: tar --use-compress-program='zstd -d -T0' -xf build.tar.zst && rm build.tar.zst

    - name: Restore packages
      run: dotnet restore Content.Tests/Content.Tests.csproj

    # .github/ci.runsettings writes native NUnit XML before NUnit3TestAdapter
    # converts the result to MTP. This preserves individual Assert.Multiple
    # failures when teardown adds a warning to the same result.
    #
    # The test app is executed directly rather than through `dotnet test` so the
    # step log is the test platform's own output. Banner, ANSI redraws and the
    # live progress display are off, and ci.runsettings suppresses per-test
    # console output, which leaves failures (message and stack trace) and the
    # final summary as the only things in the log. Full per-test detail lives in
    # the TRX and NUnit XML artifacts.
    - name: Run Content.Tests
      run: |
        timeout --signal=TERM --kill-after=2m 15m \
          dotnet exec bin/Content.Tests/Content.Tests.dll --no-banner --no-ansi --no-progress --report-trx --report-trx-filename test-results.trx --results-directory /tmp/test-results --settings .github/ci.runsettings

    - name: Convert Content.Tests results to CTRF
      if: always()
      run: |
        if [ ! -f /tmp/test-results/test-results.trx ]; then
          echo "No Content.Tests TRX result was produced; skipping CTRF conversion"
          exit 0
        fi
        dotnet tool restore
        dotnet tool run DotnetCtrfJsonReporter \
          --trx-path /tmp/test-results/test-results.trx \
          --output-directory /tmp/test-results/ctrf \
          --test-tool nunit

    - name: Upload Content.Tests results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: test-nunit-content
        # Upload only the two report files, keeping blame and other diagnostic XML
        # files out; test-report.yml reads this artifact for fork PRs.
        path: |
          /tmp/test-results/**/test-results.xml
          /tmp/test-results/ctrf/ctrf-report.json
        retention-days: 7
        if-no-files-found: ignore

  integration-tests:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    name: "Integration Tests (shard ${{ matrix.shard }})"
    runs-on: ubuntu-latest
    steps:
    # See the note in content-tests: checkout must precede extracting the tarball.
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6

    - name: Download build artifact
      uses: actions/download-artifact@v8
      with:
        name: build-output

    - name: Extract build
      run: tar --use-compress-program='zstd -d -T0' -xf build.tar.zst && rm build.tar.zst

    - name: Restore packages
      run: |
        dotnet restore Content.IntegrationTests/Content.IntegrationTests.csproj

    # Same run config as Content.Tests: same direct test-app invocation, differing
    # only in the sharded runsettings (which itself extends .github/ci.runsettings
    # with the shard's <Where> filter). The shard existence check guards a shard
    # that was assigned no tests.
    - name: Run Content.IntegrationTests
      run: |
        RUNSETTINGS=".integration-filters/shard_${{ matrix.shard }}.runsettings"
        if [ ! -f "$RUNSETTINGS" ]; then
          echo "No tests assigned to shard ${{ matrix.shard }}"
          exit 0
        fi
        timeout --signal=TERM --kill-after=2m 15m \
          dotnet exec bin/Content.IntegrationTests/Content.IntegrationTests.dll --no-banner --no-ansi --no-progress --report-trx --report-trx-filename test-results.trx --results-directory /tmp/test-results --settings "$RUNSETTINGS"

    - name: Convert integration test results to CTRF
      if: always()
      run: |
        if [ ! -f /tmp/test-results/test-results.trx ]; then
          echo "No integration-test TRX result was produced; skipping CTRF conversion"
          exit 0
        fi
        dotnet tool restore
        dotnet tool run DotnetCtrfJsonReporter \
          --trx-path /tmp/test-results/test-results.trx \
          --output-directory /tmp/test-results/ctrf \
          --test-tool nunit

    - name: Upload test results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: test-nunit-shard-${{ matrix.shard }}
        path: |
          /tmp/test-results/**/test-results.xml
          /tmp/test-results/ctrf/ctrf-report.json
        retention-days: 7
        if-no-files-found: ignore

  yaml-linter:
    name: YAML Linter
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6

    - name: Restore NuGet cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ hashFiles('Directory.Packages.props') }}
        restore-keys: nuget-

    - name: Download build artifact
      uses: actions/download-artifact@v8
      with:
        name: build-output

    - name: Extract build
      run: tar --use-compress-program='zstd -d -T0' -xf build.tar.zst && rm build.tar.zst

    - name: Restore packages
      run: dotnet restore Content.YAMLLinter/Content.YAMLLinter.csproj

    - name: Run Linter
      run: dotnet run --project Content.YAMLLinter/Content.YAMLLinter.csproj --no-build --configuration DebugOpt

  ci-success:
    name: Debug CI Required
    if: ${{ always() }}
    needs:
      - build
      - content-tests
      - integration-tests
      - yaml-linter
    # Pure orchestration: checkout + artifact download + Node-based reporters +
    # an echo. No compilation and no .NET, so the 1 vCPU ubuntu-slim image is a
    # good fit (git/node are preinstalled on it).
    runs-on: ubuntu-slim
    steps:
      # Keep repository context available to the inline reporters; the native
      # NUnit XML itself comes from the downloaded artifacts.
      - name: Checkout
        uses: actions/checkout@v7

      # Pull every shard's NUnit XML into one tree. Each artifact lands in its own
      # subdirectory (test-nunit-shard-<N>).
      - name: Download shard test results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: test-nunit-shard-*
          path: /tmp/shard-nunit

      # One report for the whole suite. dorny accepts a glob and aggregates every
      # matched XML into a single check run, so no pre-merge step is needed — it
      # reads all six shards' local files directly and emits one "Integration
      # Tests" check run. (Each artifact extracts under its own
      # test-nunit-shard-<N>/ subdir, hence the recursive **.)
      # - name: Generate intergration test report.
      #   uses: dorny/test-reporter@v3
      #   with:
      #     report-title: 'Intergration Tests'
      #     name: Integration Tests
      #     path: '/tmp/shard-nunit/**/*.xml'
      #     reporter: dotnet-nunit
      #     list-suites: all
      #     list-tests: failed
      #     fail-on-error: false
      #     collapsed: 'always'

      # - name: Generate content test report.
      #   uses: dorny/test-reporter@v3
      #   with:
      #     report-title: 'Content Tests'
      #     name: Content Tests
      #     artifact: test-nunit-content
      #     path: '*.xml'
      #     reporter: dotnet-nunit
      #     list-suites: all
      #     list-tests: failed
      #     fail-on-error: false
      #     collapsed: 'always'

      # The CTRF report is additive: the native NUnit artifacts above continue
      # to feed dorny, while the JSON copies feed the CTRF reporter.
      - name: Download CTRF test results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: test-nunit-*
          path: /tmp/ctrf-results

      - name: Generate CTRF test report
        if: always()
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: '/tmp/ctrf-results/**/*.json'
          title: Debug Test Results (CTRF)
          github-report: true
          failed-folded-report: true
          exit-on-no-files: false
          exit-on-fail: false
          status-check: true
          status-check-name: 'GitHub Test Reporter Results'
          community-report: true
          community-report-name: failed-detailed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Fail if any dependency was not successful
        if: ${{ needs.build.result != 'success' || needs['content-tests'].result != 'success' || needs['integration-tests'].result != 'success' || needs['yaml-linter'].result != 'success' }}
        run: |
          echo "build=${{ needs.build.result }}"
          echo "content-tests=${{ needs['content-tests'].result }}"
          echo "integration-tests=${{ needs['integration-tests'].result }}"
          echo "yaml-linter=${{ needs['yaml-linter'].result }}"
          exit 1

      - name: CI succeeded
        run: exit 0

  cleanup:
    name: Cleanup Artifacts
    needs:
      - content-tests
      - integration-tests
      - yaml-linter
    if: always()
    # Runs a single Node-based delete-artifact action — nothing CPU-bound — so the
    # lightweight 1 vCPU ubuntu-slim image is plenty.
    runs-on: ubuntu-slim
    steps:
      # Deleting an artifact needs `actions: write`, which a fork PR's read-only
      # token never gets. Tolerate the 403 there; `retention-days: 1` on the
      # upload reclaims the storage anyway.
      - name: Delete build artifact
        continue-on-error: true
        uses: geekyeggo/delete-artifact@v6
        with:
          name: build-output
