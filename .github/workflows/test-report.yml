name: Test Report

on:
  workflow_run:
    workflows: ['Build & Test Debug']
    types:
      - completed

# No checkout step is required because the reporters read uploaded artifacts.
permissions:
  contents: read
  actions: read
  checks: write

jobs:
  report:
    name: Publish test results
    # Reporting actions only — no checkout or build — so the lightweight 1 vCPU
    # ubuntu-slim image is a good fit.
    runs-on: ubuntu-slim
    if: >-
      ${{ github.event.workflow_run.conclusion != 'cancelled'
      && github.event.workflow_run.head_repository.full_name != github.repository }}
    steps:
      - name: Content Tests
        uses: dorny/test-reporter@v3
        with:
          artifact: test-nunit-content
          name: Content Tests
          path: '**/*.xml'
          reporter: dotnet-nunit
          list-suites: all
          list-tests: failed
          fail-on-error: false
          fail-on-empty: false

      - name: Integration Tests
        uses: dorny/test-reporter@v3
        with:
          artifact: /test-nunit-shard-(.*)/
          name: 'Integration Tests (shard $1)'
          path: '**/*.xml'
          reporter: dotnet-nunit
          list-suites: all
          list-tests: failed
          fail-on-error: false
          fail-on-empty: false

      - name: Download CTRF test results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: test-nunit-*
          path: /tmp/ctrf-results
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: CTRF Test Results
        if: always()
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: '/tmp/ctrf-results/**/*.json'
          title: Debug Test Results (CTRF)
          github-report: true
          exit-on-no-files: false
          exit-on-fail: false
