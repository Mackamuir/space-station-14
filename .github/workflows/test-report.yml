name: Test Report

on:
  workflow_run:
    workflows: ['Build & Test Debug']
    types:
      - completed

# No checkout step is required because both reporters read uploaded artifacts.
permissions:
  contents: read
  actions: read
  checks: write

jobs:
  report:
    name: Publish test results
    # Two Node-based dorny reporters and nothing else — no checkout, no build — so
    # the lightweight 1 vCPU ubuntu-slim image is a good fit.
    runs-on: ubuntu-slim
    if: >-
      ${{ github.event.workflow_run.conclusion != 'cancelled'
      && github.event.workflow_run.head_repository.full_name != github.repository }}
    steps:
      - name: Content Tests
        uses: dorny/test-reporter@v3
        with:
          artifact: test-nunit-content
          name: Content Tests
          path: '**/*.xml'
          reporter: dotnet-nunit
          list-suites: all
          list-tests: failed
          fail-on-error: false
          fail-on-empty: false

      - name: Integration Tests
        uses: dorny/test-reporter@v3
        with:
          artifact: /test-nunit-shard-(.*)/
          name: 'Integration Tests (shard $1)'
          path: '**/*.xml'
          reporter: dotnet-nunit
          list-suites: all
          list-tests: failed
          fail-on-error: false
          fail-on-empty: false
