name: Harvest Test Timings

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 6 * * 1'

permissions:
  contents: read
  checks: write

# Never run two baselines at once, and let a running one finish rather than
# cancelling it (a half-run produces truncated timings).
concurrency:
  group: harvest-test-timings
  cancel-in-progress: false

jobs:
  harvest:
    name: Harvest timings (sequential baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Submodule
        run: git submodule update --init --recursive

      - name: Pull engine updates
        uses: space-wizards/submodule-dependency@v0.1.5

      - name: Update Engine Submodules
        run: |
          cd RobustToolbox/
          git submodule update --init --recursive

      # setup-dotnet reads the repository's global.json automatically, keeping
      # the SDK selection in one place. The build performs its implicit restore.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build Project
        run: dotnet build --configuration DebugOpt /m

      - name: Run all integration tests (single worker, no sharding)
        id: run-tests
        env:
          DOTNET_gcServer: "1"
        run: |
          mkdir -p /tmp/test-logs /tmp/test-results
          set -o pipefail
          timeout --signal=TERM --kill-after=2m 300m \
            dotnet tool run dotnet-trace -- collect \
              --profile gc-verbose \
              --output /tmp/test-results/integration-tests.nettrace \
              --show-child-io \
              -- \
              dotnet exec bin/Content.IntegrationTests/Content.IntegrationTests.dll \
                --no-banner --no-ansi --no-progress \
                --report-trx \
                --report-trx-filename results.trx \
                --results-directory /tmp/test-results \
                --hangdump --hangdump-timeout 5min \
                --settings .github/ci-sequential.runsettings \
            2>&1 | tee /tmp/test-logs/integration-tests.log

      - name: Report Content.IntegrationTests results
        if: success() || failure()
        uses: dorny/test-reporter@v3
        with:
          name: Integration Tests (sequential baseline)
          path: /tmp/test-results/**/*.trx
          reporter: dotnet-trx
          list-suites: all
          list-tests: failed

      - name: Upload integration test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-log
          path: /tmp/test-logs/integration-tests.log
          retention-days: 14
          if-no-files-found: ignore

      # Raw results for local inspection; nothing downstream reads these.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-sequential
          path: /tmp/test-results/**/*.trx
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload memory trace
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-memory-trace
          path: /tmp/test-results/integration-tests.nettrace
          retention-days: 14
          if-no-files-found: ignore

      - name: Harvest timings
        id: harvest
        if: always()
        run: |
          # Don't let a harvest failure (e.g. no .trx because the build broke)
          # abort the job before the summary runs.
          set +e
          python3 Tools/_Starlight/partition_tests.py harvest /tmp/test-results Tools/_Starlight/test-timings.json
          harvest_rc=$?
          set -e
          if [ "$harvest_rc" -ne 0 ]; then
            echo "changed=error" >> "$GITHUB_OUTPUT"
            echo "changed_lines=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Diff the freshly harvested file against the committed one. An empty
          # diff means every measurement stayed inside the noise dead-band, so
          # committing would be a no-op.
          git diff -- Tools/_Starlight/test-timings.json > /tmp/timings.diff || true
          if [ -s /tmp/timings.diff ]; then
            changed_lines=$(grep -E '^[+-]' /tmp/timings.diff | grep -vE '^(\+\+\+|---)' | wc -l)
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_lines=$changed_lines" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "changed_lines=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload test-timings.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-timings
          path: Tools/_Starlight/test-timings.json
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo "## Test timings harvested (sequential baseline)"
            echo
            if [ "${{ steps.run-tests.outcome }}" != "success" ]; then
              echo ":warning: **Test run did not fully pass** (\`${{ steps.run-tests.outcome }}\`)."
              echo "Timings from a crashed, hung or timed-out run are missing or truncated — do not commit this as a baseline."
              echo
            fi
            case "${{ steps.harvest.outputs.changed }}" in
              true)
                echo ":large_orange_diamond: **Would overwrite \`test-timings.json\`** — ${{ steps.harvest.outputs.changed_lines }} line(s) moved past the noise dead-band. Committing this run changes the file."
                echo
                echo "<details><summary>Show diff vs committed timings</summary>"
                echo
                echo '```diff'
                cat /tmp/timings.diff
                echo '```'
                echo
                echo "</details>"
                ;;
              false)
                echo ":white_check_mark: **No change** — every timing stayed within the dead-band of the committed \`test-timings.json\`. Committing would be a no-op, so no PR is needed."
                ;;
              *)
                echo ":x: **Harvest did not produce a result** — no \`.trx\` files were parsed. The committed \`test-timings.json\` is unchanged."
                ;;
            esac
            echo
            echo "Download the \`test-timings\` artifact and commit it as \`Tools/_Starlight/test-timings.json\`."
            echo "Once committed, \`partition_tests.py generate\` picks it up automatically;"
            echo "\`WEIGHT_OVERRIDES\` stays as the fallback for when the file is absent."
            echo
            echo "### Slowest 15 methods"
            echo '```'
            python3 -c "import json;d=json.load(open('Tools/_Starlight/test-timings.json'));[print(f'{v:9.1f}s  {k}') for k,v in sorted(d.items(),key=lambda x:-x[1])[:15]]"
            echo '```'
            echo
            echo "### Memory profile"
            if [ -f /tmp/test-results/integration-tests.nettrace ]; then
              echo "A \`dotnet-trace\` GC trace with sampled allocations is available in the \`integration-test-memory-trace\` artifact."
            else
              echo ":warning: No memory trace was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
