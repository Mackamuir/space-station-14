- type: !PartialOnly entity
  id: BaseTraitorStealObjective
  components:
  - type: Objective
    difficulty: 1.5 # this was way too high and it made stuff like hypo, crew monitor, license and diploma cost 2.75 which is odd
  - type: ObjectiveBlacklistRequirement
    blacklist:
      components:
      - DieCondition # it's been a common complaint that this objective is *impossible* with DAGD, since you physically can't extract with it.

- type: !PartialOnly entity
  id: EscapeShuttleObjective
  components:
  - type: Objective
    difficulty: 1
  - type: ObjectiveBlacklistRequirement
    blacklist:
      components:
      - DieCondition # makes no sense you can get both.

- type: !PartialOnly entity
  id: DieObjective
  components:
  - type: ObjectiveLimit
    limit: 3

- type: !PartialOnly entity
  id: KillRandomPersonObjective
  components:
  - type: Objective
    difficulty: 1.5

- type: !PartialOnly entity
  id: KillRandomHeadObjective
  components:
  - type: Objective
    difficulty: 2.5

- type: !PartialOnly entity
  id: RandomTraitorAliveObjective
  components:
  - type: PickRandomPerson
    filters:
    - !type:TargetObjectiveMindFilter
      !CombineIndex:1 blacklist:
        components:
        - DieCondition # don't help DAGDs.

- type: !PartialOnly entity
  id: RandomTraitorProgressObjective
  components:
  - type: Objective
    difficulty: 1 # i have NO idea why the difficulty was so high, its a big fat nothingburger
  - type: PickRandomPerson
    filters:
    - !type:ObjectiveMindFilter
      !CombineIndex:1 blacklist:
        components:
        - DieCondition
    - !type:TargetObjectiveMindFilter
      !CombineIndex:2 blacklist:
        components:
        - DieCondition
  - type: ObjectiveBlacklistRequirement
    blacklist:
      components:
      - HelpProgressCondition

