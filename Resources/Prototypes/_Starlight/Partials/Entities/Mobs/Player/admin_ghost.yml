  - type: CriminalRecordsConsole
  - type: AdminGhostHud
  - type: ShowCriminalRecordIcons
  - type: ShowJobIcons
  - type: ShowMindShieldIcons
  - type: ShowSyndicateIcons
  - type: ShowHealthBars
    damageContainers:
      - Biological
      - Inorganic
      - Silicon
      - IPC
      - Hybrid
  - type: ShowHealthIcons
    damageContainers:
      - Biological
      - Inorganic
      - Silicon
      - IPC
      - Hybrid
  - type: ShowHungerIcons
  - type: ShowThirstIcons
