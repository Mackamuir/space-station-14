      enum.SecureCommandTerminalUiKey.Key:
        type: SecureCommandTerminalBui
      enum.CharacterRecordConsoleKey.Key:
        type: CharacterRecordConsoleBoundUserInterface
  - type: IntrinsicUI
    uis:
      enum.SolarControlConsoleUiKey.Key: !Remove
      enum.CargoConsoleUiKey.Orders: !Remove
      enum.GeneralStationRecordConsoleKey.Key: !Remove
  - type: SecureCommandTerminalConsole
    admin: true
  - type: CrewMonitoringConsole
    pagingEnabled: false
  - type: CharacterRecordConsole
