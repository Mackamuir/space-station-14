- type: !PartialOnly entity
  id: XenoborgEngi
  suffix: No Brain
  components:
  - type: BorgChassis
    maxModules: 8
  - type: ContainerFill
    containers:
      borg_brain: !Remove
      borg_module:
      - !Remove BorgModuleRCD
      - !Index:3 XenoborgModuleRCD
  - type: ShowHealthBars
    damageContainers:
    - IPC
    - Hybrid
  - type: ItemSlots
    slots:
      cell_slot:
        blacklist:
          tags:
          - MechReactor

