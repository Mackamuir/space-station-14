- type: !PartialOnly entity
  id: MedicalBorgChassisDerelict
  components:
  - type: ShowHealthBars
    damageContainers:
    - Hybrid # Neocytes
  - type: ShowHealthIcons
    damageContainers:
    - Hybrid # Neocytes
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
    channels:
    - Binary
    - Common
    - Command
    - Engineering
    - Medical
    - Science
    - Security
    - Service
    - Supply
    - Law
  - type: ActiveRadio
