- type: !PartialOnly entity
  id: !type:CreateVariants
    values: &protos
    - GasPipeStraight
    - GasPipeBend
    - GasPipeTJunction
    - GasPipeFourway
  components:
    - type: SandboxCopyOverride
      override: !type:CreateVariants
        values: *protos

- type: !PartialOnly entity
  id: GasPipeSansLayers
  components:
  # RPD
  - type: RCDDeconstructable
    cost: 1
    delay: 2
    fx: EffectRCDDeconstruct2
    rpd: true

- type: !PartialOnly entity
  id: GasPipeStraight
  components:
  - type: VentCrawlTube
  - type: VentCrawlTransit

- type: !PartialOnly entity
  id: GasPipeBend
  components:
  - type: VentCrawlTube
  - type: VentCrawlBend

- type: !PartialOnly entity
  id: GasPipeTJunction
  components:
  - type: VentCrawlTube
  - type: VentCrawlJunction
    degrees:
      - 0
      - 90
      - -90

- type: !PartialOnly entity
  id: GasPipeFourway
  components:
  - type: VentCrawlTube
  - type: VentCrawlJunction
    degrees:
      - 0
      - 90
      - -90
      - 180

- type: !PartialOnly entity
  id: GasPipeManifold
  components:
  - type: VentCrawlTube
  - type: VentCrawlManifold
    layerCount: 5
  - type: VentCrawlTransit
