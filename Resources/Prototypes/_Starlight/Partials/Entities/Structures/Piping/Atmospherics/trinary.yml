- type: !PartialOnly entity
  id: !type:CreateVariants
    values: &protos
    - GasFilter
    - GasFilterFlipped
    - GasMixer
    - GasMixerFlipped
    - PressureControlledValve
  components:
    - type: SandboxCopyOverride
      override: !type:CreateVariants
        values: *protos

- type: !PartialOnly entity
  id: GasTrinaryBase
  placement:
    mode: AlignAtmosPipeLayers

- type: !PartialOnly entity
  id: GasFilter
  placement:
    mode: AlignAtmosPipeLayers
  components:
  - type: VentCrawlTube
  - type: VentCrawlJunction
    degrees:
      - 0
      - -90
      - 180
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
    prefix: device-address-prefix-gas-filter
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSink
    ports:
      - On
      - Off
      - Toggle
  - type: GasFilterSignal

