- type: !PartialOnly entity
  id: ClothingHeadHelmetBasic
  components:
  - type: Clothing
    clothingVisuals:
      head:
      - state: light-equipped-HELMET
      # - state: shaded
      head-vox:
      - state: equipped-HELMET-vox
      # - state: shaded
  - type: ToggleableVisuals
    clothingVisuals:
      head:
      - state: lighton-equipped-HELMET
        shader: unshaded
      head-vox:
      - state: lighton-equipped-HELMET-vox
        shader: unshaded

