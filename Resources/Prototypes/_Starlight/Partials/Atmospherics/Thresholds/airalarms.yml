- type: !PartialOnly alarmThreshold
  id: stationTemperature
  lowerBound: !type:AlarmThresholdSetting
    threshold: 233.15 # Was -80C. Changed to -40C.
  lowerWarnAround: !type:AlarmThresholdSetting
    threshold: 1.1286 # Was -60C. Changed to -10C (when uninsulated reptilians start taking damage).

- type: !PartialOnly alarmThreshold
  id: stationOxygen
  lowerBound: !type:AlarmThresholdSetting
    threshold: 0.17 # Was 0.10, now 0.17. Danger triggers <=17% oxygenation.
  upperBound: !type:AlarmThresholdSetting
    threshold: 0.45 # Was 30% o2, now 45% o2.
  lowerWarnAround: !type:AlarmThresholdSetting
    threshold: 1.179 # Was 1.5x, now 1.179x. Warning triggers <=20% oxygenation.
