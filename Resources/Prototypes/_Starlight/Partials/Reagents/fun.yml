- type: !PartialOnly reagent
  id: Fiber
  metabolisms:
    Digestion:
      effects:
      - !type:SatiateHunger
        !CombineIndex:0 conditions:
        - !type:MetabolizerTypeCondition
          !CombineIndex:0 type:
          - Neocyte

- type: !PartialOnly reagent
  id: BuzzochloricBees
  contrabandSeverity: Major # Minor -> Major
  metabolisms:
    Bloodstream:
      effects:
      - !type:AdjustReagent
        conditions:
        - !type:ReagentCondition
          reagent: BuzzochloricBees
          min: 0.26
        - !type:MetabolizerTypeCondition
          type: [Cyclorite]
        reagent: BuzzochloricBees
        amount: 0.25

