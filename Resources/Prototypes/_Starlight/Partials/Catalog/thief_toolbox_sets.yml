- type: !PartialOnly thiefBackpackSet
  id: SyndieSet
  description: thief-backpack-category-syndie-description-starlight
  content:
  - !Remove Emag
  - !Remove Lighter
  - CameraBug # Until thieves get an emag that can't arm borgs, stop giving them the ability to make guns. Was originally a syndie encryption key but Thieves aren't told not to reveal nukies like pAIs.
  - Stimpack # Needed something to make up for losing the emag. When the Emag is replaced with a ThiefMag, this can be removed.
  - InterdyneFlippo # Might as well keep the theme, no?
  - SyndicatePersonalAI # allows the thief to be able to communicate indirectly with traitors, without accidentally spoiling nukies.

